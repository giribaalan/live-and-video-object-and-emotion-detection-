services:
  - type: web
    name: advanced-vision-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT render_start:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
